<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/nuumeric-design-system-358bec69-55e7-4868-9a4c-c115168774a8/tokens/colors.css">
<link rel="stylesheet" href="_ds/nuumeric-design-system-358bec69-55e7-4868-9a4c-c115168774a8/tokens/typography.css">
<link rel="stylesheet" href="_ds/nuumeric-design-system-358bec69-55e7-4868-9a4c-c115168774a8/styles.css">
<script src="_ds/nuumeric-design-system-358bec69-55e7-4868-9a4c-c115168774a8/_ds_bundle.js"></script>
</helmet>
<section aria-label="Certifications and credentials" style="{{ sectionStyle }}">
  <div style="max-width:1280px;margin:0 auto;padding:28px 32px;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:16px 40px;font-family:var(--font-body)">
    <div style="display:flex;align-items:center;gap:10px">
      <span style="{{ iconStyle }}"></span>
      <span style="font-size:13px;font-weight:500;letter-spacing:0.01em;white-space:nowrap">Zoho Finance Advisor</span>
    </div>
    <div style="display:flex;align-items:center;gap:10px">
      <span style="{{ iconStyle }}"></span>
      <span style="font-size:13px;font-weight:500;letter-spacing:0.01em;white-space:nowrap">Xero Advisor</span>
    </div>
    <div style="display:flex;align-items:center;gap:10px">
      <span style="{{ iconStyle }}"></span>
      <span style="font-size:13px;font-weight:500;letter-spacing:0.01em;white-space:nowrap">QuickBooks ProAdvisor</span>
    </div>
    <div style="display:flex;align-items:center;gap:10px">
      <span style="{{ iconStyle }}"></span>
      <span style="font-size:13px;font-weight:500;letter-spacing:0.01em;white-space:nowrap">Gusto Payroll</span>
    </div>
    <div style="display:flex;align-items:center;gap:10px">
      <span style="{{ iconStyle }}"></span>
      <span style="font-size:13px;font-weight:500;letter-spacing:0.01em;white-space:nowrap">SurePayroll Accountant</span>
    </div>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:84},&quot;variant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
function mask(name, size, color) {
  const url = `https://unpkg.com/lucide-static@latest/icons/${name}.svg`;
  return `display:inline-block;width:${size}px;height:${size}px;flex:none;background-color:${color};-webkit-mask:url(${url}) center/contain no-repeat;mask:url(${url}) center/contain no-repeat`;
}

class Component extends DCLogic {
  renderVals() {
    const dark = (this.props.variant ?? "light") === "dark";
    return {
      sectionStyle: dark
        ? "border-top:1px solid rgba(57,181,74,0.2);border-bottom:1px solid rgba(57,181,74,0.2);background:#1c211c;color:#f7f8f7"
        : "border-top:1px solid #eceeec;border-bottom:1px solid #eceeec;background:#f7f8f7;color:#2f362f",
      iconStyle: mask("badge-check", 18, dark ? "#39b54a" : "#2e933c"),
    };
  }
}
</script>
</body>
</html>
