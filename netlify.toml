[build]
  # No package.json / build tooling — dist/ is pre-rendered static HTML committed to the repo.
  # "true" overrides the UI's leftover "pnpm run build" command, which fails since there's no package.json.
  command = "true"
  publish = "dist"

# Each page is a folder index.html, so URLs are clean with no config:
#   /  /services  /about  /what-to-expect  /careers  /contact  /refer  /blog

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
